name: Build

# Builds SpriteScout for Windows, Mac and Linux. Publishing a tag like v1.7
# attaches all three to that release; you can also start a run by hand from the
# Actions tab to check the tests still pass everywhere.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            built: dist/SpriteScout.exe
            asset: SpriteScout-windows.exe
          - os: macos-latest
            built: dist/SpriteScout
            asset: SpriteScout-mac
          - os: ubuntu-latest
            built: dist/SpriteScout
            asset: SpriteScout-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the tests that don't need Scratch
        run: python tests/run_tests.py --offline

      - name: Build
        run: |
          pip install pyinstaller==6.22.3
          pyinstaller --onefile --console --name SpriteScout spritescout.py

      - name: Name it after the system it's for
        shell: bash
        run: mv "${{ matrix.built }}" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Add it to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "${{ matrix.asset }}" --clobber
