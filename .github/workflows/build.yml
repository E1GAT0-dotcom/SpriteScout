name: Build

# Builds SpriteScout for Windows, Mac and Linux. Publishing a tag like v1.7
# attaches all three to that release; you can also start a run by hand from the
# Actions tab to check the tests still pass everywhere.
on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Attach the builds to this release tag (leave blank to only build)"
        required: false
        default: ""

permissions:
  contents: write

# Publishing a release also creates its tag, which starts a second identical
# run. One is enough, so the newer run replaces the older one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every push gets the quick tests; only tags and releases get the builds.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tests/run_tests.py --offline

  build:
    needs: tests
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          # The text version, and the GUI version that opens in a window of its own.
          # Everything but Windows goes out as a zip: a browser strips the permission
          # a program needs to run, so a bare download opens as a page of gibberish.
          # Unzipping puts it back. The Mac app goes out the way Mac apps do: a disk
          # image that opens onto the app and an Applications folder to drag it to.
          - os: windows-latest
            program: spritescout.py
            built: dist/SpriteScout.exe
            asset: SpriteScout-windows.exe
            extra: --icon icon.ico
          - os: macos-latest
            program: spritescout.py
            built: dist/SpriteScout
            asset: SpriteScout-mac.zip
            extra: ""
          - os: ubuntu-latest
            program: spritescout.py
            built: dist/SpriteScout
            asset: SpriteScout-linux.zip
            extra: ""
          - os: windows-latest
            program: spritescout_gui.py
            built: dist/SpriteScout.exe
            asset: SpriteScout-gui-windows.exe
            extra: --windowed --icon icon.ico --add-data "gui.html;." --add-data "icon.png;."
          - os: macos-latest
            program: spritescout_gui.py
            built: dist/SpriteScout.app
            asset: SpriteScout-gui-mac.dmg
            extra: --windowed --icon icon.icns --add-data "gui.html:." --add-data "icon.png:."
          - os: ubuntu-latest
            program: spritescout_gui.py
            built: dist/SpriteScout
            asset: SpriteScout-gui-linux.zip
            extra: --add-data "gui.html:." --add-data "icon.png:."
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the tests that don't need Scratch
        run: python tests/run_tests.py --offline

      - name: Build
        run: |
          pip install pyinstaller==6.22.3
          pyinstaller --onefile --name SpriteScout ${{ matrix.extra }} ${{ matrix.program }}

      - name: Check the finished program can reach Scratch from somebody else's computer
        if: matrix.program == 'spritescout.py'
        shell: bash
        env:
          # The build machine's certificates, gone, as they are on the computer
          # someone downloads this to. Without its own fallback it couldn't connect.
          SSL_CERT_FILE: /nowhere/cert.pem
          SSL_CERT_DIR: /nowhere/certs
          BUILT: ${{ matrix.built }}
        run: |
          answer=$("$BUILT" 74763380 --no-log --no-update-check --depth 40 2>&1) || true
          echo "$answer"
          if ! grep -q "Pizza Rush" <<< "$answer"; then
            echo "The finished program couldn't talk to Scratch, so nobody who downloads it could either."
            exit 1
          fi

      - name: Name it after the system it's for
        shell: bash
        env:
          BUILT: ${{ matrix.built }}
          ASSET: ${{ matrix.asset }}
        run: |
          if [[ "$ASSET" == *.dmg ]]; then
            mkdir disk && cp -R "$BUILT" disk/
            brew install create-dmg > /dev/null
            # The window people expect: the app on the left, Applications on the right.
            if ! create-dmg --volname SpriteScout --volicon icon.icns --window-size 560 360 \
                   --icon-size 128 --icon SpriteScout.app 150 170 --hide-extension SpriteScout.app \
                   --app-drop-link 410 170 "$ASSET" disk/; then
              echo "Couldn't arrange the window, so making a plain one with the same two things in it."
              rm -f "$ASSET"
              ln -s /Applications disk/Applications
              hdiutil create -volname SpriteScout -srcfolder disk -ov -format UDZO "$ASSET"
            fi
          elif [[ "$ASSET" != *.zip ]]; then
            mv "$BUILT" "$ASSET"
          elif [[ "$RUNNER_OS" == "macOS" && -d "$BUILT" ]]; then
            # ditto keeps the permission to run, and keeps a .app folder whole.
            ditto -c -k --keepParent "$BUILT" "$ASSET"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            # A single program goes at the top of the zip, not inside a dist folder.
            ditto -c -k "$BUILT" "$ASSET"
          else
            (cd "$(dirname "$BUILT")" && zip -q "$GITHUB_WORKSPACE/$ASSET" "$(basename "$BUILT")")
          fi

      - name: Check it still runs once it's unzipped
        if: endsWith(matrix.asset, '.zip')
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir unpacked
          (cd unpacked && unzip -q "../$ASSET")
          program=$(find unpacked -type f -name SpriteScout -perm -u+x | head -n 1)
          if [[ -z "$program" ]]; then
            echo "Unzipped, it can't be run as a program, so it would open as gibberish."
            exit 1
          fi
          echo "Unzips to a program that can run: $program"

      - name: Check the disk image opens onto the app and Applications
        if: endsWith(matrix.asset, '.dmg')
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          hdiutil attach "$ASSET" -mountpoint /tmp/spritescout-disk -nobrowse -quiet
          ls -la /tmp/spritescout-disk
          test -x /tmp/spritescout-disk/SpriteScout.app/Contents/MacOS/SpriteScout
          test -L /tmp/spritescout-disk/Applications
          hdiutil detach /tmp/spritescout-disk -quiet
          echo "Opens onto SpriteScout.app and an Applications folder to drag it to."

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Add it to the release
        if: github.event_name != 'workflow_dispatch' || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" "${{ matrix.asset }}" --clobber
